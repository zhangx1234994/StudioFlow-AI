services:
  studioflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studioflow
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5005:12222"
    volumes:
      - ./data:/srv/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:12222/healthz', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
