[project]
name = "photo2video-mvp"
version = "0.1.0"
description = "MVP backend for turning product photos into short conversion videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "oss2>=2.18.6"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
